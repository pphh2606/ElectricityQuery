name: Build Test APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    env:
      CI_TEST_SIGNING: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 只装 platform-tools：该 action 默认还会装已从 SDK 仓库下架的 legacy `tools` 包，
          # 会导致 sdkmanager 报 "Failed to find package 'tools'" 并以退出码 1 中断整个作业
          packages: 'platform-tools'

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK (fixed test signing)
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          archive: false

      - name: Read release APK metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: apk-info
        uses: zhaobozhen/apk-info-action@v1.1.3
        with:
          apk-path: app/build/outputs/apk/release/app-release.apk

      - name: Checkout assets repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v6
        with:
          repository: pphh2606/ElectricityQuery-assets
          ref: main
          path: assets
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Publish CI APK and metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          printf '%s' "$COMMIT_MESSAGE" > commit-message.txt
          cp -f app/build/outputs/apk/release/app-release.apk assets/app-release-ci.apk
          python3 "${{ github.workspace }}/.github/scripts/write_assets_metadata.py" \
            --output assets/ci.json \
            --version "${{ steps.apk-info.outputs.version-name }}" \
            --version-code "${{ steps.apk-info.outputs.version-code }}" \
            --target "${{ steps.apk-info.outputs.target-sdk-version }}" \
            --min "${{ steps.apk-info.outputs.min-sdk-version }}" \
            --compile "${{ steps.apk-info.outputs.compile-sdk-version }}" \
            --package-size "${{ steps.apk-info.outputs.file-size }}" \
            --link "https://github.com/pphh2606/ElectricityQuery-assets/blob/main/app-release-ci.apk" \
            --note-file commit-message.txt
          cd assets
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ci.json app-release-ci.apk
          git commit -m "Update CI metadata"
          git push origin main

  publish-release:
    # 发布 Release 时由 CI 构建 release APK，并挂到该 Release 的资产上。
    # 这样稳定版资产来自可追溯的 CI 构建，不需要本地构建后手工上传；
    # Release 事件使用的是默认分支上的本文件，所以改动必须先合入 main 才生效。
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      # 上传 Release 资产需要写权限，仓库默认的只读 GITHUB_TOKEN 不够用
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 只装 platform-tools：该 action 默认还会装已从 SDK 仓库下架的 legacy `tools` 包，
          # 会导致 sdkmanager 报 "Failed to find package 'tools'" 并以退出码 1 中断整个作业
          packages: 'platform-tools'

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK to release
        # gh 由 ubuntu-latest 预装；--clobber 允许重跑时覆盖同名资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" app/build/outputs/apk/release/app-release.apk --clobber

  sync-stable:
    # 必须等 publish-release 把 APK 传完，否则 releases/latest 里还没有资产，
    # sync_latest_stable.py 会以「No APK asset found」失败
    needs: publish-release
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 只装 platform-tools：该 action 默认还会装已从 SDK 仓库下架的 legacy `tools` 包，
          # 会导致 sdkmanager 报 "Failed to find package 'tools'" 并以退出码 1 中断整个作业
          packages: 'platform-tools'

      - name: Fetch latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/sync_latest_stable.py \
            --repo pphh2606/ElectricityQuery \
            --output-apk stable.apk \
            --output-info stable-info.json \
            --output-body stable-body.txt

      - name: Read stable APK metadata
        id: apk-info
        uses: zhaobozhen/apk-info-action@v1.1.3
        with:
          apk-path: stable.apk

      - name: Checkout assets repository
        uses: actions/checkout@v6
        with:
          repository: pphh2606/ElectricityQuery-assets
          ref: main
          path: assets
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Publish stable APK and metadata
        run: |
          set -euo pipefail
          cp -f stable.apk assets/app-release-stable.apk
          python3 "${{ github.workspace }}/.github/scripts/write_assets_metadata.py" \
            --output assets/stable.json \
            --version "${{ steps.apk-info.outputs.version-name }}" \
            --version-code "${{ steps.apk-info.outputs.version-code }}" \
            --target "${{ steps.apk-info.outputs.target-sdk-version }}" \
            --min "${{ steps.apk-info.outputs.min-sdk-version }}" \
            --compile "${{ steps.apk-info.outputs.compile-sdk-version }}" \
            --package-size "${{ steps.apk-info.outputs.file-size }}" \
            --link "https://github.com/pphh2606/ElectricityQuery-assets/blob/main/app-release-stable.apk" \
            --note-file "${{ github.workspace }}/stable-body.txt"
          cd assets
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add stable.json app-release-stable.apk
          git commit -m "Update stable metadata"
          git push origin main
